name: Build Orca APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8 (required by Gradle 4.10.1 / AGP 3.3.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Android SDK 28 components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PdisablePreDex --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orca-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
