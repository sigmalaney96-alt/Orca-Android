name: Build Orca APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ORCA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ORCA_RELEASE_KEYSTORE_BASE64 }}
      ORCA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ORCA_RELEASE_KEYSTORE_PASSWORD }}
      ORCA_RELEASE_KEY_ALIAS: ${{ secrets.ORCA_RELEASE_KEY_ALIAS }}
      ORCA_RELEASE_KEY_PASSWORD: ${{ secrets.ORCA_RELEASE_KEY_PASSWORD }}
      ORCA_RELEASE_SIGNING_CONFIGURED: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 28 components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"

      - name: Fetch pinned Google VR SDK archive
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/googlevr/gvr-android-sdk/f6b00dea8dc6a6f8b5e8da8897ade615b170b088/libraries/sdk-base-1.200.0.aar" \
            --output app/libs/sdk-base-1.200.0.aar
          echo "f3a69613fd414903ea11664b82ee425ba113422bde153c30b504d76eb047a5b5  app/libs/sdk-base-1.200.0.aar" | sha256sum --check

      - name: Set up Java 8 for Gradle 4.10.1 and Android Gradle Plugin 3.3.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare private release signing key
        if: env.ORCA_RELEASE_KEYSTORE_BASE64 != '' && env.ORCA_RELEASE_KEYSTORE_PASSWORD != '' && env.ORCA_RELEASE_KEY_ALIAS != '' && env.ORCA_RELEASE_KEY_PASSWORD != ''
        run: |
          store_file="$RUNNER_TEMP/orca-release.jks"
          echo "ORCA_RELEASE_STORE_FILE=$store_file" >> "$GITHUB_ENV"
          printf '%s' "$ORCA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$store_file"
          test -s "$store_file"
          keytool -list -keystore "$store_file" \
            -storepass "$ORCA_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$ORCA_RELEASE_KEY_ALIAS" > /dev/null
          chmod 600 "$store_file"
          echo "ORCA_RELEASE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease -PdisablePreDex --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Orca-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: env.ORCA_RELEASE_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Orca-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: env.ORCA_RELEASE_SIGNING_CONFIGURED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Orca-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
