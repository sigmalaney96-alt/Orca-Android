name: Build Orca APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 28 components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"

      - name: Set up Java 8 for Gradle 4.10.1 and Android Gradle Plugin 3.3.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PdisablePreDex --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Orca-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
