<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>You are offline - Orca</title>
<style>
body{margin:0;background:#0B1018;color:#EEF5FF;font-family:sans-serif;text-align:center;padding:24px}
.eyebrow{color:#44B4E5;text-transform:uppercase;font-size:12px;letter-spacing:.1em}
p{color:#92A5BC}
button{background:#44B4E5;color:#0B1018;border:0;border-radius:8px;padding:10px 20px;font-size:16px}
#g{display:grid;grid-template-columns:repeat(4,64px);gap:4px;justify-content:center;margin:20px auto}
.t{width:64px;height:64px;background:#172332;border-radius:6px;position:relative;cursor:pointer}
.t i{position:absolute;background:#44B4E5}
.win .t i{background:#4ADE80}
#s{font-weight:bold}
</style></head><body>
<div class="eyebrow">Connection interrupted</div>
<h1>You are offline</h1>
<p>That page could not be reached. Check your connection and try again, or take a short break with Bit-Swapper.</p>
<button onclick="location.reload()">Try again</button>
<div id="g"></div><div id="s">Connect the circuit</div>
<script>
// dirs: 0=top 1=right 2=bottom 3=left
var N=4,TYPES=[[1,2],[2,3],[3,0],[0,1],[0,2],[1,3],[0,1,2,3]];
var grid=[],g=document.getElementById('g'),st=document.getElementById('s');
function base(r,c){if(r==0&&c==0||r==N-1&&c==N-1)return[0,2];return TYPES[Math.floor(Math.random()*TYPES.length)]}
function init(){grid=[];g.className='';st.textContent='Connect the circuit';
 for(var r=0;r<N;r++){grid[r]=[];for(var c=0;c<N;c++)grid[r][c]={d:base(r,c).slice(),a:(r==0&&c==0||r==N-1&&c==N-1)};
  var t=grid[r][c];if(!t.a)for(var k=Math.floor(Math.random()*4);k>0;k--)t.d=t.d.map(function(x){return(x+1)%4});}
 // guarantee a solvable path: straight/cross-free simple L path along edges
 for(var i=0;i<N;i++){grid[i][0].d=i==0?[2]:i==N-1?[0,1]:[0,2];grid[i][0].a=true}
 grid[0][0].d=[1,2];
 for(var j=1;j<N;j++){grid[N-1][j].d=j==N-1?[3,0]:[1,3];grid[N-1][j].a=true}
 for(var r=0;r<N;r++)for(var c=0;c<N;c++){var t=grid[r][c];if(t.a)for(var k=Math.floor(Math.random()*4);k>0;k--)t.d=t.d.map(function(x){return(x+1)%4});}
 draw()}
function draw(){g.innerHTML='';for(var r=0;r<N;r++)for(var c=0;c<N;c++){(function(r,c){var el=document.createElement('div');el.className='t';
 grid[r][c].d.forEach(function(d){var i=document.createElement('i');
  var s=[['28px','0','8px','32px'],['28px','32px','32px','8px'],['32px','28px','8px','32px'],['28px','0','32px','8px']][d];
  i.style.cssText='left:'+(d==1?'32px':d==3?'0':'28px')+';top:'+(d==0?'0':d==2?'32px':'28px')+';width:'+(d%2?'32px':'8px')+';height:'+(d%2?'8px':'32px');el.appendChild(i)});
 el.onclick=function(){if(g.className=='win'){init();return}var t=grid[r][c];t.d=t.d.map(function(x){return(x+1)%4});draw();check()};g.appendChild(el)})(r,c)}}
function has(r,c,d){return grid[r][c].d.indexOf(d)>=0}
function check(){var seen={},q=[[0,0]];seen['0,0']=1;var dr=[-1,0,1,0],dc=[0,1,0,-1];
 while(q.length){var p=q.shift(),r=p[0],c=p[1];for(var d=0;d<4;d++){if(!has(r,c,d))continue;var nr=r+dr[d],nc=c+dc[d];
  if(nr<0||nc<0||nr>=N||nc>=N||seen[nr+','+nc]||!has(nr,nc,(d+2)%4))continue;seen[nr+','+nc]=1;q.push([nr,nc])}}
 if(seen[(N-1)+','+(N-1)]){g.className='win';st.textContent='CIRCUIT CONNECTED! ACCESS GRANTED! (Click to Restart)'}}
init();
</script></body></html>
